<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Credits</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  overflow: hidden;
  text-align: center;
}

.container {
  height: 100vh;
  position: relative;
}

.credits {
  position: absolute;
  width: 100%;
  animation: scroll 270s linear forwards;
  animation-play-state: paused;
}

@keyframes scroll {
  from { transform: translateY(100vh); }
  to   { transform: translateY(-300%); }
}

.spacer {
  height: 5vh;
}

.section {
  margin: 100px 0;
}

.endroll{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 40px;
  width: fit-content;
}
button {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<div class="container">
  <div class="credits" id="credits">

    <div class="spacer"></div>

   <div class="class-row">

     <div class="endroll">
  <div>1 学年 名前</div>
  <div>2 学年 名前</div>
  <div>3 学年 名前</div>
  <div>4 学年 名前</div>
</div>

</div>

  </div>
</div>
  
<audio id="music" src="melt.mp3" preload="auto"></audio>

<button onclick="play()">再生</button>

<script>
const credits = document.getElementById("credits");
const music = document.getElementById("music");

function play() {
  music.currentTime = 0;
  music.play().catch(e => console.log(e));
  credits.style.animationPlayState = "running";
}
</script>

</body>
</html>
