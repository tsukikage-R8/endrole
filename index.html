<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Credits</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  overflow: hidden;
  text-align: center;
}

.container {
  height: 100vh;
  position: relative;
}

/* スクロール */
.credits {
  position: absolute;
  width: 100%;
  animation: scroll 270s linear forwards;
  animation-play-state: paused;
}

@keyframes scroll {
  from { transform: translateY(100vh); }
  to   { transform: translateY(-300%); }
}

.spacer {
  height: 30vh;
}

.section {
  margin: 100px 0;
}

button {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<div class="container">
  <div class="credits" id="credits">

    <div class="spacer"></div>

    <div class="section">
      <h2>キャスト</h2>
      <p>生徒01 生徒02 生徒03 生徒04 生徒05</p>
    </div>

    <div class="section">
      <h2>Teachers</h2>
      <p>山田 太郎</p>
    </div>

  </div>
</div>

<!-- 音楽 -->
<audio id="music" src="melt.mp3" preload="auto"></audio>

<button onclick="play()">再生</button>

<script>
const credits = document.getElementById("credits");
const music = document.getElementById("music");

function play() {
  music.currentTime = 0;
  music.play().catch(e => console.log(e));
  credits.style.animationPlayState = "running";
}
</script>

</body>
</html>
